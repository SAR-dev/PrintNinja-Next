[package]
name = "printninja"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "printninja_lib"
crate-type = ["cdylib", "staticlib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
# The local print API (plan phase 8): axum on the app's own tokio
# runtime (tauri's), a listener of its own; tower for the LAN gate's
# middleware layer.
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["net", "time", "macros", "rt"] }
# The community registry client (plan phase 9): the sync engine's
# HTTP calls.
reqwest = { workspace = true }
# Job ids for the local print API, and the pairing codes and tokens.
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
# printninja:// deep links (plan phase 8): the plugin delivers the
# URL; single-instance forwards it to the running app when the OS
# hands the link to a fresh process instead (the `deep-link` feature
# re-parses the second instance's args through the deep-link plugin
# and emits the URL on the first instance's handle).
tauri-plugin-deep-link = "2"
# External links (the update badge's release page): the webview cannot
# open them itself, so the opener plugin hands them to the OS.
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# The deep link's query strings, the same decoder the old app used.
urlencoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
pn-scene = { path = "../core/scene" }
pn-profiles = { path = "../core/profiles" }
pn-planner = { path = "../core/planner" }
pn-encoders = { path = "../core/encoders" }
pn-render = { path = "../core/render" }
pn-browser = { path = "../core/browser" }
pn-job = { path = "../core/job" }
pn-transport = { path = "../core/transport" }

[dev-dependencies]
# The registry client's tests speak to a live pn-server on a
# throwaway port (plan phase 9).
pn-server = { path = "../server" }
