[package]
name = "printninja"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "printninja_lib"
crate-type = ["cdylib", "staticlib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
pn-scene = { path = "../core/scene" }
pn-profiles = { path = "../core/profiles" }
pn-planner = { path = "../core/planner" }
pn-encoders = { path = "../core/encoders" }
pn-render = { path = "../core/render" }
pn-browser = { path = "../core/browser" }
pn-job = { path = "../core/job" }
pn-transport = { path = "../core/transport" }
