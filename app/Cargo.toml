[package]
name = "printninja"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "printninja_lib"
crate-type = ["cdylib", "staticlib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
# The local print API (plan phase 8): axum on the app's own tokio
# runtime (tauri's), a listener of its own.
axum = "0.8"
tokio = { version = "1", features = ["net", "time"] }
# Job ids for the local print API.
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
pn-scene = { path = "../core/scene" }
pn-profiles = { path = "../core/profiles" }
pn-planner = { path = "../core/planner" }
pn-encoders = { path = "../core/encoders" }
pn-render = { path = "../core/render" }
pn-browser = { path = "../core/browser" }
pn-job = { path = "../core/job" }
pn-transport = { path = "../core/transport" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
