# CI for the printninja-next workspace.
#
# Jobs:
#   web-check         frontend build (app/ui) -> dist artifact
#   rust-lint         cargo fmt --check + cargo clippy -D warnings (Linux)
#   rust-test-linux   workspace tests in the Docker test container +
#                     virtual-printer fixture tests (host)
#   rust-test-windows workspace tests natively + fixture tests
#
# The app crate embeds app/ui/dist at compile time
# (tauri::generate_context!), so every Rust job downloads the web-dist
# artifact first.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  web-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: app/ui/dist
          if-no-files-found: error

  rust-lint:
    runs-on: ubuntu-latest
    needs: web-check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            patchelf
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app/ui/dist
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  rust-test-linux:
    runs-on: ubuntu-latest
    needs: web-check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy, rustfmt
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app/ui/dist
      - name: Workspace tests in the Docker test container
        run: docker compose -f tests/docker-compose.test.yml run --rm rust-test
      - name: Virtual printer fixture tests
        run: cargo test --manifest-path tests/e2e/support/virtual-printer/Cargo.toml

  rust-test-windows:
    runs-on: windows-latest
    needs: web-check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app/ui/dist
      - run: cargo test
      - run: cargo test --manifest-path tests\e2e\support\virtual-printer\Cargo.toml
